title: LSASS Memory Access for Credential Theft
status: experimental
author: 'TryHackMe DetectMare training scenario; adapted from lab work by winsmunt'
description: >-
  Detect potentially suspicious LSASS process access using call trace modules or access masks, excluding documented internal software.
logsource:
  product: windows
  category: process_access
detection:
  selection_target:
    TargetImage|endswith: '\lsass.exe'
  selection_trace:
    CallTrace|contains:
      - 'comsvcs.dll'
      - 'dbghelp.dll'
      - 'dbgcore.dll'
  selection_access:
    GrantedAccess:
      - '0x1fffff'
      - '0x1438'
      - '0x1410'
  filter_edr:
    SourceImage|startswith: 'C:\Program Files\ResearchEDR\'
  filter_pam:
    SourceImage|startswith: 'C:\Program Files\ResearchPAM\'
  filter_wer:
    SourceImage|endswith: '\WerFault.exe'
    GrantedAccess: '0x1410'
  condition: selection_target and (selection_trace or selection_access) and not 1 of filter_*
